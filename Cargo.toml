[package]
name = "whispercrabs"
version = "0.1.24"
edition = "2024"
rust-version = "1.85"
authors = ["Adolfo Usier"]
license = "MIT"
description = "Local-first floating voice-to-text (STT) and text-to-speech (TTS) tool for Linux, macOS, and Windows"
repository = "https://github.com/adolfousier/whispercrabs"
homepage = "https://github.com/adolfousier/whispercrabs"
readme = "README.md"
keywords = ["whisper", "speech-to-text", "text-to-speech", "transcription", "gtk4"]
categories = ["multimedia::audio", "gui"]
exclude = ["src/screenshots/*", ".github/*", ".DS_Store"]

[dependencies]
gtk4 = "0.9"
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", features = ["multipart", "json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
whisper-rs = "0.15"
rubato = "0.14"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
arboard = "3"

# macOS: set the Dock icon at runtime when running outside an .app bundle.
# These crates are already in the tree via arboard, so this adds no new
# transitive dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
] }

# Windows: embed the icon resource into the executable at link time.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
